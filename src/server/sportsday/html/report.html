<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Results and awards · Machabeng Sports Day 2026</title>
<meta name="description" content="Final house ranking, individual awards and every event result from the Machabeng College Inter-House Sports Day.">
<meta property="og:title" content="Results and awards · Machabeng Sports Day 2026">
<meta property="og:description" content="Final house ranking, individual awards and every event result from the Machabeng College Inter-House Sports Day.">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<link rel="icon" href="/img/crest.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Figtree:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#0d1b2e;--mute:#5a6b85;--line:#d8e0ec;--brand:#0a1f3d}
*{box-sizing:border-box}body{margin:0;font:16px/1.5 Figtree,system-ui,sans-serif;color:var(--ink);background:#eef2f8}
h1,h2,h3{font-family:"Big Shoulders Display",Impact,sans-serif;font-weight:900;line-height:1;margin:0}
.page{max-width:900px;margin:0 auto;padding:20px 20px 60px;background:#fff;min-height:100vh}
.bar{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;margin-bottom:12px}
.btn{display:inline-flex;align-items:center;min-height:42px;padding:6px 16px;border-radius:10px;border:1.5px solid #b9c5d8;background:#fff;font:inherit;font-weight:700;cursor:pointer;text-decoration:none;color:var(--ink)}
.btn.p{background:#17a05a;border-color:#17a05a;color:#fff}
header.rep{display:flex;gap:16px;align-items:center;border-bottom:4px solid var(--brand);padding-bottom:14px;margin-bottom:16px}
header.rep img{width:80px;height:80px;border-radius:50%}header.rep h1{font-size:48px}header.rep p{margin:4px 0 0;color:var(--mute)}
.stamp{display:inline-block;padding:3px 12px;border-radius:999px;font-weight:700;font-size:13px;background:#fff0d6;color:#7a4b00}.stamp.final{background:#d7f0e1;color:#0c6b37}
.win{border:2px solid #e8b820;background:#fff8e0;border-radius:14px;padding:14px 18px;margin:14px 0;display:flex;gap:14px;align-items:center}.win b{font:900 36px/1 "Big Shoulders Display",sans-serif}
.win svg{flex:none;color:#a86b00}
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:end;margin:12px 0 20px}
.podium-card{position:relative;min-width:0;overflow:hidden;padding:18px 16px 36px;border:1px solid #d8e0ec;border-top:6px solid var(--house-color);border-radius:18px;background:linear-gradient(180deg,#fff,#f8fafc);box-shadow:0 10px 24px #0f172a0b}
.podium-card.place-1{order:2;padding-top:28px;transform:translateY(-10px);border-color:#eab308;box-shadow:0 16px 34px #eab30828}
.podium-card.place-2{order:1}.podium-card.place-3{order:3}
.podium-place{display:inline-flex;padding:5px 10px;border-radius:999px;background:#eef2f8;color:#475569;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.04em}
.podium-card.place-1 .podium-place{background:#fef3c7;color:#92400e}
.podium-card h3{margin:12px 0 0;overflow:hidden;color:var(--house-color);font-size:27px;text-overflow:ellipsis;text-transform:uppercase;white-space:nowrap}
.podium-score{margin:8px 0 14px;color:#0d1b2e;font:900 44px/.9 "Big Shoulders Display",sans-serif;font-variant-numeric:tabular-nums}
.podium-card.place-1 .podium-score{font-size:58px}.podium-score small{margin-left:5px;color:#64748b;font:700 12px/1 Figtree,sans-serif;text-transform:uppercase}
.report-medals{display:flex;flex-wrap:wrap;gap:5px}.report-medals span{padding:4px 7px;border:1px solid #e2e8f0;border-radius:999px;background:#fff;color:#475569;font-size:11px;font-weight:700}
.report-medals b{margin-left:3px;color:#0f172a;font:800 14px "Big Shoulders Display",sans-serif}
.report-medals .gold{border-color:#eab30866}.report-medals .silver{border-color:#94a3b866}.report-medals .bronze{border-color:#b8733366}
.podium-base{position:absolute;right:0;bottom:0;left:0;padding:4px 10px;background:color-mix(in srgb,var(--house-color) 12%,white);color:var(--house-color);font:900 16px "Big Shoulders Display",sans-serif;text-align:center}
h2{font-size:34px;margin:28px 0 10px;border-bottom:2px solid var(--line);padding-bottom:6px}h3{font-size:22px;margin:0 0 6px}
table{width:100%;border-collapse:collapse;margin-bottom:6px}th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left}th{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.05em}th.n{text-align:right}td.n{text-align:right}td.p{font:900 22px/1 "Big Shoulders Display",sans-serif;width:48px}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px}
.ev{break-inside:avoid;margin-bottom:16px}.ev small{color:var(--mute);font-weight:400;font-size:14px}
.big td{font-size:18px}.empty{color:var(--mute)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:0 24px}@media(max-width:700px){.cols{grid-template-columns:1fr}.podium{grid-template-columns:1fr;align-items:stretch}.podium-card.place-1{order:1;transform:none}.podium-card.place-2{order:2}.podium-card.place-3{order:3}header.rep h1{font-size:34px}}
footer{margin-top:30px;color:var(--mute);font-size:13px;border-top:1px solid var(--line);padding-top:10px}
@media print{body{background:#fff}.bar{display:none}.page{padding:0;max-width:none}h2{break-after:avoid}}
</style>
</head>
<body>
<div class="page">
  <div class="bar"><a class="btn" href="/">← Live site</a><a class="btn" href="/api/results.csv">Download CSV</a><button class="btn p" id="print" type="button">Print / save as PDF</button></div>
  <div id="doc"><p class="empty">Loading results…</p></div>
</div>
<script src="/js/report.js"></script>
</body>
</html>
